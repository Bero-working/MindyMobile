appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 90000
- scrollUntilVisible:
    element:
      id: 'phase-one-preview-button'
    direction: DOWN
- tapOn:
    id: 'phase-one-preview-button'
- tapOn:
    id: 'preview-auth-button'
- scrollUntilVisible:
    element:
      id: 'welcome-register-button'
    direction: DOWN
- tapOn:
    id: 'welcome-register-button'
- scrollUntilVisible:
    element:
      id: 'register-submit-button'
    direction: DOWN
- tapOn:
    id: 'register-submit-button'
- hideKeyboard
- assertVisible:
    id: 'register-display-name-input'
- takeScreenshot: 'phase1-register-large-text'
- tapOn:
    id: 'preview-tools-toggle'
- tapOn:
    id: 'preview-menu-button'
- tapOn:
    id: 'preview-home-button'
- assertVisible:
    id: 'home-tab-home'
- scrollUntilVisible:
    element:
      id: 'home-course-select-preview-0'
    direction: DOWN
- takeScreenshot: 'phase1-home-large-text'
- assertVisible:
    id: 'home-tab-home'
