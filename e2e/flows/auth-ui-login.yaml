appId: ${APP_ID || "com.mindymobile"}
tags:
  - ci
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 90000
- tapOn:
    id: auth-back-button
- assertVisible:
    id: welcome-screen
- tapOn:
    id: welcome-login-button
- assertVisible:
    id: login-screen
- takeScreenshot: auth-login
- tapOn:
    id: login-submit-button
- assertVisible:
    id: login-screen
- assertVisible:
    text: 'Vui lòng điền thông tin này\.|Please fill in this field\.'
- tapOn:
    id: login-register-link
- assertVisible:
    id: register-screen
