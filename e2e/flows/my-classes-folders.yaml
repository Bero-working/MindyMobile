appId: ${APP_ID || "com.mindymobile"}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 90000
- scrollUntilVisible:
    element:
      id: 'phase-one-preview-button'
    direction: DOWN
- tapOn:
    id: 'phase-one-preview-button'
- tapOn:
    id: 'preview-classes-button'
- assertVisible:
    id: 'my-classes-screen'
- takeScreenshot: 'phase3-my-classes'
- tapOn:
    id: 'my-classes-course-web'
- assertNotVisible:
    id: 'my-classes-open-full'
- tapOn:
    id: 'my-classes-course-web'
- assertVisible:
    id: 'my-classes-open-full'
- assertNotVisible:
    id: 'my-classes-view-history'
- takeScreenshot: 'phase3-my-classes-final'
