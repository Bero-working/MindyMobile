appId: ${APP_ID || "com.mindymobile"}
tags:
  - ci
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 90000
- tapOn:
    id: 'phase-one-preview-button'
- tapOn:
    id: 'preview-schedule-button'
- assertVisible:
    id: 'schedule-screen'
- takeScreenshot: 'phase3-schedule'
- tapOn:
    id: 'schedule-next-week'
- assertVisible:
    id: 'schedule-empty'
- tapOn:
    id: 'schedule-today'
- tapOn:
    id: 'schedule-session-full-session'
- assertVisible:
    id: 'schedule-screen'
- assertNotVisible:
    id: 'class-session-screen'
- tapOn:
    id: 'learning-preview-tools'
- tapOn:
    id: 'learning-preview-error'
- assertVisible:
    id: 'schedule-retry'
- takeScreenshot: 'phase3-schedule-error'
- tapOn:
    id: 'schedule-retry'
- tapOn:
    id: 'learning-preview-tools'
- tapOn:
    id: 'learning-preview-empty'
- assertVisible:
    id: 'schedule-empty'
- takeScreenshot: 'phase3-schedule-empty'
- tapOn:
    id: 'learning-preview-tools'
- tapOn:
    id: 'learning-preview-success'
- assertVisible:
    id: 'schedule-session-full-session'
- takeScreenshot: 'phase3-schedule-final'
