appId: ${APP_ID || "com.mindymobile"}
tags:
  - payment-result-preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'login-screen'
    timeout: 90000
- tapOn:
    id: 'auth-back-button'
- scrollUntilVisible:
    element:
      id: 'phase-one-preview-button'
    direction: DOWN
- tapOn:
    id: 'phase-one-preview-button'
- scrollUntilVisible:
    element:
      id: 'preview-payment-result-button'
    direction: UP
- tapOn:
    id: 'preview-payment-result-button'
- tapOn:
    id: 'preview-result-PAID'
- assertVisible:
    id: 'payment-result-ticket'
- assertNotVisible:
    id: 'payment-result-check-again'
- takeScreenshot: 'phase5-PAID'
- scrollUntilVisible:
    element:
      id: 'payment-result-home'
    direction: DOWN
- tapOn:
    id: 'payment-result-home'
- assertVisible:
    id: 'home-screen'
- assertNotVisible:
    id: 'payment-result-surface'
- tapOn:
    id: 'preview-tools-toggle'
- tapOn:
    id: 'preview-menu-button'
- scrollUntilVisible:
    element:
      id: 'preview-payment-result-button'
    direction: UP
- tapOn:
    id: 'preview-payment-result-button'
- tapOn:
    id: 'preview-result-CANCELLED'
- assertVisible:
    id: 'payment-result-ticket'
- assertNotVisible:
    id: 'payment-result-check-again'
- takeScreenshot: 'phase5-CANCELLED'
- scrollUntilVisible:
    element:
      id: 'payment-result-retry'
    direction: DOWN
- tapOn:
    id: 'payment-result-retry'
- assertVisible:
    id: 'courses-screen'
- assertNotVisible:
    id: 'payment-result-surface'
- tapOn:
    id: 'preview-tools-toggle'
- tapOn:
    id: 'preview-menu-button'
- scrollUntilVisible:
    element:
      id: 'preview-payment-result-button'
    direction: UP
- tapOn:
    id: 'preview-payment-result-button'
- tapOn:
    id: 'preview-result-EXPIRED'
- assertVisible:
    id: 'payment-result-ticket'
- assertNotVisible:
    id: 'payment-result-check-again'
- takeScreenshot: 'phase5-EXPIRED'
- scrollUntilVisible:
    element:
      id: 'payment-result-retry'
    direction: DOWN
- tapOn:
    id: 'payment-result-retry'
- assertVisible:
    id: 'courses-screen'
- assertNotVisible:
    id: 'payment-result-surface'
- tapOn:
    id: 'preview-tools-toggle'
- tapOn:
    id: 'preview-menu-button'
- scrollUntilVisible:
    element:
      id: 'preview-payment-result-button'
    direction: UP
- tapOn:
    id: 'preview-payment-result-button'
- tapOn:
    id: 'preview-result-PAID'
- back
- assertVisible:
    id: 'home-screen'
- assertNotVisible:
    id: 'payment-result-surface'
