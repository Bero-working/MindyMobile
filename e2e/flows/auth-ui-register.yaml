appId: ${APP_ID || "com.mindymobile"}
tags:
  - ci
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 90000
- tapOn:
    id: login-register-link
- assertVisible:
    id: register-screen
- scrollUntilVisible:
    element:
      id: register-submit-button
    direction: DOWN
- tapOn:
    id: register-submit-button
- assertVisible:
    id: register-screen
- takeScreenshot: auth-register-validation
- scrollUntilVisible:
    element:
      id: register-login-link
    direction: DOWN
- tapOn:
    id: register-login-link
- assertVisible:
    id: login-screen
