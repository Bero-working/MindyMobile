appId: ${APP_ID || "com.mindymobile"}
tags:
  - ci
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 90000
- tapOn:
    id: 'phase-one-preview-button'
- tapOn:
    id: 'preview-account-button'
- assertVisible:
    id: 'account-screen'
- takeScreenshot: 'phase3-account'
- tapOn:
    id: 'account-profile'
- scrollUntilVisible:
    element:
      id: 'account-profile-fields'
    direction: DOWN
- takeScreenshot: 'phase3-profile'
- tapOn:
    id: 'account-sheet-close'
- scrollUntilVisible:
    element:
      id: 'account-language'
    direction: DOWN
- tapOn:
    id: 'account-language'
- tapOn:
    id: 'account-language-en-EN'
- tapOn:
    id: 'account-language'
- tapOn:
    id: 'account-language-vi-VN'
- scrollUntilVisible:
    element:
      id: 'account-logout'
    direction: DOWN
- tapOn:
    id: 'account-logout'
- assertVisible:
    id: 'account-logout-confirm'
- tapOn:
    id: 'account-logout-confirm'
- assertVisible:
    id: 'preview-account-button'
