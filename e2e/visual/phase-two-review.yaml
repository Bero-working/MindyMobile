appId: ${APP_ID || "com.mindymobile"}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 90000
- scrollUntilVisible:
    element:
      id: 'phase-one-preview-button'
    direction: DOWN
- tapOn:
    id: 'phase-one-preview-button'
- tapOn:
    id: 'preview-courses-button'
- assertVisible:
    id: 'courses-screen'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 'review-catalog'
- tapOn:
    id: 'courses-filter-button'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 'review-filter'
- back
- tapOn:
    id: 'preview-tools-toggle'
- tapOn:
    id: 'preview-state-loading'
- tapOn:
    id: 'preview-tools-toggle'
- assertVisible:
    id: 'courses-loading'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 'review-catalog-loading'
- tapOn:
    id: 'preview-tools-toggle'
- tapOn:
    id: 'preview-state-empty'
- tapOn:
    id: 'preview-tools-toggle'
- assertVisible:
    id: 'courses-empty'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 'review-catalog-empty'
- tapOn:
    id: 'preview-tools-toggle'
- tapOn:
    id: 'preview-state-error'
- tapOn:
    id: 'preview-tools-toggle'
- scrollUntilVisible:
    element:
      id: 'courses-retry'
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 'review-catalog-error'
- tapOn:
    id: 'courses-retry'
- tapOn:
    id: 'courses-tab-home'
- assertVisible:
    id: 'home-screen'
- scrollUntilVisible:
    element:
      id: 'home-course-open-demo-0'
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 'review-home-course-arrow'
- tapOn:
    id: 'home-course-open-demo-0'
- assertVisible:
    id: 'course-sheet'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 'review-home-course-sheet'
- back
- scrollUntilVisible:
    element:
      id: 'home-intro-dot-0'
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 'review-home-carousel'
