appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 90000
- takeScreenshot: 'handoff-compact-welcome'
- scrollUntilVisible:
    element:
      id: 'phase-one-preview-button'
    direction: DOWN
- tapOn:
    id: 'phase-one-preview-button'
- tapOn:
    id: 'preview-home-button'
- assertVisible:
    id: 'home-header'
- takeScreenshot: 'handoff-compact-home'
- scrollUntilVisible:
    element:
      id: 'home-compiler-button'
    direction: DOWN
- takeScreenshot: 'handoff-compact-compiler'
