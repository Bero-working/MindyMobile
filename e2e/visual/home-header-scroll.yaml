appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 90000
- scrollUntilVisible:
    element:
      id: 'phase-one-preview-button'
    direction: DOWN
- tapOn:
    id: 'phase-one-preview-button'
- tapOn:
    id: 'preview-home-button'
- takeScreenshot: 'header-motion-hero'
- scrollUntilVisible:
    element:
      id: 'home-explore-courses-button'
    direction: DOWN
- assertVisible:
    id: 'home-compact-header'
- takeScreenshot: 'header-motion-compact'
- tapOn:
    id: 'home-compact-logo'
- extendedWaitUntil:
    visible:
      id: 'home-header'
    timeout: 10000
- assertNotVisible:
    id: 'home-compact-header'
- takeScreenshot: 'header-motion-back-to-top'
