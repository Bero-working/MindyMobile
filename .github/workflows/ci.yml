name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  typecheck:
    name: Type checking
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint:type-check

  eslint:
    name: ESLint and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint:rules -- --no-cache
      - run: npm run lint:code-format

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run Jest with coverage
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          npm test -- --ci --runInBand --watch=false --coverage 2>&1 | tee ci-logs/jest.log
      - name: Sanitize diagnostics
        if: always()
        run: python3 .github/scripts/sanitize-logs.py
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/
            ci-logs/jest.log
          if-no-files-found: error
          retention-days: 7

  e2e-android:
    name: E2E Android
    needs: [typecheck, eslint, unit-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare disk space for Android
        run: bash .github/scripts/prepare-linux-runner.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'
      - uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: bash .github/scripts/android-toolchain.sh
      - run: bash .github/scripts/prepare-env.sh development
      - name: Verify Pixel 7 device profile
        shell: bash
        run: |
          avdmanager list device > ci-logs/device-profiles.log
          grep -F '"pixel_7"' ci-logs/device-profiles.log
      - name: Build x86_64 debug APK
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --max-workers=2 2>&1 | tee ../ci-logs/android-debug.log
          ./gradlew --stop 2>&1 | tee -a ../ci-logs/android-debug.log
      - name: Install pinned Maestro
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          chmod +x "$RUNNER_TEMP/maestro-cli/maestro/bin/maestro"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run 13 preview flows
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 300
          # Zero transition scale enables Reduced Motion and creates a blocking Reanimated LogBox.
          disable-animations: false
          script: bash .github/scripts/e2e-android.sh
      - name: Sanitize diagnostics
        if: always()
        run: python3 .github/scripts/sanitize-logs.py
      - name: Upload e2e-android
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-e2e/
            ci-logs/
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android
    needs: [typecheck, eslint, unit-tests, e2e-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_API_URL: ${{ vars.CI_API_URL }}
      CI_APP_ORIGIN: ${{ vars.CI_APP_ORIGIN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare disk space for Android
        run: bash .github/scripts/prepare-linux-runner.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'
      - uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: bash .github/scripts/android-toolchain.sh
      - run: bash .github/scripts/prepare-env.sh production
      - name: Build Release APK and AAB (CI debug signing)
        shell: bash
        run: |
          set -o pipefail
          npm run build:android 2>&1 | tee ci-logs/android-apk.log
          npm run build:android:bundle 2>&1 | tee ci-logs/android-aab.log
      - run: python3 .github/scripts/package-artifacts.py android
      - name: Upload android-release-ci-debug-signed
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-ci-debug-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Sanitize diagnostics
        if: always()
        run: python3 .github/scripts/sanitize-logs.py
      - name: Upload android-build-logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7

  build-ios:
    name: Build iOS Simulator
    needs: [typecheck, eslint, unit-tests, e2e-android]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CI_API_URL: ${{ vars.CI_API_URL }}
      CI_APP_ORIGIN: ${{ vars.CI_APP_ORIGIN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: bash .github/scripts/prepare-env.sh production
      - uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4 # v1.207.0
        with:
          ruby-version: '3.2.6'
          bundler: '2.6.9'
      - name: Install Pods and record resolved toolchain
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          xcodebuild -version | tee ci-logs/xcode-version.log
          ruby --version | tee ci-logs/ruby-version.log
          bundle --version | tee ci-logs/bundler-version.log
          bundle config set --local path vendor/bundle
          bundle install 2>&1 | tee ci-logs/bundle-install.log
          bundle exec pod --version | tee ci-logs/cocoapods-version.log
          cd ios
          bundle exec pod install 2>&1 | tee ../ci-logs/pod-install.log
          cp Podfile.lock ../ci-logs/Podfile.lock.txt
          cp ../Gemfile.lock ../ci-logs/Gemfile.lock.txt
          echo "NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"
      - name: Build unsigned Release Simulator app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace ios/MindyMobile.xcworkspace -scheme MindyMobile \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ci-logs/ios-build.log
      - run: python3 .github/scripts/package-artifacts.py ios
      - name: Upload ios-simulator-release
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Sanitize diagnostics
        if: always()
        run: python3 .github/scripts/sanitize-logs.py
      - name: Upload ios-build-logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7
