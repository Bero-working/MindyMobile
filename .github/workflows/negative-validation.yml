name: Native failure-path validation
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-negative-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  HUSKY: '0'
jobs:
  android-build-negative:
    name: Android invalid build option (expected failure)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17.0.14+7'
      - run: npm ci
      - name: Intentionally fail the Android build command
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          chmod +x android/gradlew
          npm run build:android -- --phase04-intentional-invalid-option 2>&1 | tee ci-logs/android-negative.log
      - name: Package only on build success
        if: success()
        run: python3 .github/scripts/package-artifacts.py android
      - name: Failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-negative-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7
  ios-build-negative:
    name: iOS invalid build option (expected failure)
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Intentionally fail the Simulator build command
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          xcodebuild -version | tee ci-logs/xcode-version.log
          xcodebuild -phase04-intentional-invalid-option -workspace ios/MindyMobile.xcworkspace -scheme MindyMobile -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ci-logs/ios-negative.log
      - name: Package only on build success
        if: success()
        run: python3 .github/scripts/package-artifacts.py ios
      - name: Failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-negative-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 7